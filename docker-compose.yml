version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - airflow_network

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"  # Evitar conflictos con PostgreSQL
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./proyecto:/opt/proyecto:rw  # Mapea toda la carpeta correctamente
    networks:
      - airflow_network

  redis:
    image: redis:5-alpine
    networks:
      - airflow_network

  airflow-webserver:
    image: apache/airflow:2.10.4
    depends_on:
      - postgres
      - redis
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "true"
      _AIRFLOW_WWW_USER_USERNAME: "admin"
      _AIRFLOW_WWW_USER_PASSWORD: "admin"
    volumes:
      - /opt/proyecto:/opt/proyecto:rw  # Volumen corregido
      - /opt/proyecto/dags:/opt/airflow/dags:rw
      - /opt/proyecto/logs:/opt/airflow/logs:rw
      - ./plugins:/opt/airflow/plugins
      - /opt/proyecto/scripts:/opt/airflow/scripts:rw
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow users create \
      --username ${_AIRFLOW_WWW_USER_USERNAME} \
      --password ${_AIRFLOW_WWW_USER_PASSWORD} \
      --firstname Admin \
      --lastname User \
      --role Admin \
      --email admin@example.com &&
      airflow webserver"
    networks:
      - airflow_network

  airflow-scheduler:
    image: apache/airflow:2.10.4
    depends_on:
      - postgres
      - redis
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "true"
    volumes:
      - /opt/proyecto:/opt/proyecto:rw  # Volumen corregido
      - /opt/proyecto/dags:/opt/airflow/dags:rw
      - /opt/proyecto/logs:/opt/airflow/logs:rw
      - ./plugins:/opt/airflow/plugins
      - /opt/proyecto/scripts:/opt/airflow/scripts:rw
    command: ["scheduler"]
    networks:
      - airflow_network

  airflow-init:
    image: apache/airflow:2.10.3
    depends_on:
      - postgres
      - redis
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "true"
    volumes:
      - /opt/proyecto:/opt/proyecto:rw  # Volumen corregido
      - /opt/proyecto/dags:/opt/airflow/dags:rw
      - /opt/proyecto/logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /opt/proyecto/scripts:/opt/airflow/scripts:rw
    entrypoint: ["airflow", "db", "init"]
    networks:
      - airflow_network

volumes:
  postgres-db-volume:
  timescaledb-data:

networks:
  airflow_network:
    driver: bridge
